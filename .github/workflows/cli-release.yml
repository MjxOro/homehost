name: cli-release

# Push a tag like cli-v0.2.0 to publish the homehost CLI. Users get it from
# install.sh (served by the panel) and keep it current with `homehost update`.
on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/cli/go.mod
      - name: Check the tag
        run: |
          version="${GITHUB_REF_NAME#cli-}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like cli-v1.2.3"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: test -z "$(gofmt -l apps/cli)"
      - run: go -C apps/cli vet ./... && go -C apps/cli test ./...
      - name: Build
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}" arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go -C apps/cli build -trimpath \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "$GITHUB_WORKSPACE/dist/homehost-$os-$arch" .
          done
          (cd dist && sha256sum homehost-* > checksums.txt && cat checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # --latest=false keeps the panel's own release as the repo's "latest".
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "homehost CLI $VERSION" \
            --notes "Install: curl -fsSL https://homehost.risktozero.sh/install.sh | sh
          Update an existing install: homehost update" \
            --latest=false
