name: deploy

# Continuous deployment: merge to main → the prod box updates its live checkout,
# rebuilds, migrates, restarts. Runs directly on the box (no checkout action:
# the runner workspace is a detached HEAD without infra/private/prod.env).
# Single box, so concurrent mains serialize.
on:
  push:
    branches: [main]

concurrency:
  group: prod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, homehost-prod]
    steps:
      - run: cd /home/mjxoro/projects/homehost && bun run prod:deploy
