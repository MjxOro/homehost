name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test packages/shared packages/sites packages/bench
      # The Go worker's contract is generated from @homehost/shared.
      - run: bun run worker:contract && git diff --exit-code apps/worker/internal/contract

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homehost
          POSTGRES_USER: homehost
          POSTGRES_PASSWORD: homehost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homehost -d homehost"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      SHOWCASE_MODE: "true"
      TEST_DATABASE_URL: postgres://homehost:homehost@127.0.0.1:5432/homehost
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test:integration
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/worker/go.mod
          cache-dependency-path: apps/worker/go.sum
      - run: test -z "$(gofmt -l apps/worker apps/cli)"
      - run: bun run test:worker
      - run: bun run test:cli

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun --cwd apps/web run build
      - run: docker build -f apps/api/Dockerfile -t homehost-api:ci .
      - run: docker build -f apps/web/Dockerfile -t homehost-web:ci .
      - run: docker build -f apps/worker/Dockerfile -t homehost-worker:ci .
