name: homehost-showcase
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homehost
      POSTGRES_USER: homehost
      POSTGRES_PASSWORD: homehost
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - homehost-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehost -d homehost"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  homehost-postgres:
