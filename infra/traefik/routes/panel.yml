# Panel route. SSH is direct-v6 (never Traefik); per-desktop gui-*.yml files
# live here too (one per VM, written by the worker, removed on teardown).
#
# Cutover fallback only: the panel now routes from labels on the prod api/web
# containers (infra/prod/compose.yml). Priority 1 keeps these routers behind
# the label routers, so they serve only until the first rolling deploy brings
# those up. Delete this file once that deploy has run.
# Pattern:
#   rule: "Host(`<label>-vnc.<baseDomain>`)"
http:
  routers:
    panel-desktop:
      rule: "Host(`homehost.risktozero.sh`) && PathPrefix(`/api/desktop/t/`)"
      priority: 1
      entryPoints:
        - websecure
      service: panel
      # Capability paths are credentials. API logs redact them separately.
      observability:
        accessLogs: false
      tls:
        certResolver: letsencrypt
    panel:
      rule: "Host(`homehost.risktozero.sh`)"
      priority: 1
      entryPoints:
        - websecure
      service: panel
      tls:
        certResolver: letsencrypt
    panel-http:
      rule: "Host(`homehost.risktozero.sh`)"
      priority: 1
      entryPoints:
        - web
      middlewares:
        - https-redirect
      service: panel
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    panel:
      loadBalancer:
        servers:
          - url: "http://homehost-prod-web-1:80"
