# Panel route. SSH is direct-v6 (never Traefik); per-desktop gui-*.yml files
# live here too (one per VM, written by the worker, removed on teardown).
# Pattern:
#   rule: "Host(`<label>-vnc.<baseDomain>`)"
http:
  routers:
    panel:
      rule: "Host(`homehost.risktozero.sh`)"
      entryPoints:
        - websecure
      service: panel
      tls:
        certResolver: letsencrypt
    panel-http:
      rule: "Host(`homehost.risktozero.sh`)"
      entryPoints:
        - web
      middlewares:
        - https-redirect
      service: panel
  middlewares:
    https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    panel:
      loadBalancer:
        servers:
          - url: "http://homehost-prod-web-1:80"
