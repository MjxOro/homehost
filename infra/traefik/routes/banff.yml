# Banff trip site edge route. Single Bun container serves the SPA + /api
# (no loopback publish; Traefik reaches it over the edge network).
# Pattern mirrors routes/dev.yml. Watch picks this up without restart.
http:
  routers:
    banff:
      rule: "Host(`banff.risktozero.sh`)"
      entryPoints:
        - websecure
      service: banff
      tls:
        certResolver: letsencrypt
    banff-http:
      rule: "Host(`banff.risktozero.sh`)"
      entryPoints:
        - web
      middlewares:
        - banff-https-redirect
      service: banff
  middlewares:
    banff-https-redirect:
      redirectScheme:
        scheme: https
        permanent: true
  services:
    banff:
      loadBalancer:
        servers:
          - url: "http://banff-trip-web-1:3001"
