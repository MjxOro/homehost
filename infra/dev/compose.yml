name: homehost-dev

# Local dev loop: postgres + api (--watch) + web (vite) + worker (incus).
# One command: `bun run dev:up` (needs .env.dev; copy .env.dev.example).
# Open http://127.0.0.1:5174 — no dev domains needed. SHOWCASE_MODE in
# .env.dev picks the auth path: true = persona login (default, no OAuth),
# false = real GitHub OAuth (fill OAuth + OPERATOR_EMAILS first).
#
# Staging is LAN-only. The dev stack provisions real boxes and showcase mode
# lets anyone pick the operator persona, so it must never be reachable from
# the internet. Docker's `0.0.0.0`/`[::]` publish also lands on the host's
# public IPv6, so every port is bound to one address: loopback by default,
# or the LAN address for QA from other machines on the home network:
#   DEV_BIND_IP=192.168.1.16 bun run dev:up
# (and add http://192.168.1.16:5174 to APP_EXTRA_ORIGINS in .env.dev).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homehost
      POSTGRES_USER: homehost
      POSTGRES_PASSWORD: homehost
    ports:
      - "127.0.0.1:55433:5432"
    restart: unless-stopped
    volumes:
      - homehost-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehost -d homehost"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ../..:/app
    command: ["bash", "infra/dev/api-entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://homehost:homehost@postgres:5432/homehost
      HOST: "0.0.0.0"
      PORT: "3001"
    env_file:
      - path: ../../.env.dev
        required: true
    ports:
      - "127.0.0.1:3001:3001"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/apps/web
    volumes:
      - ../..:/app
    command: ["bun", "--bun", "vite", "--port", "5174", "--strictPort"]
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "${DEV_BIND_IP:-127.0.0.1}:5174:5174"
    restart: unless-stopped
    depends_on:
      - api

  worker:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "986"
    working_dir: /app
    volumes:
      - ../..:/app
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      # Zabbly Incus: /usr/bin/incus is a wrapper that execs /opt/incus/bin/incus.
      - /usr/bin/incus:/usr/bin/incus:ro
      - /opt/incus:/opt/incus:ro
    command: ["bun", "apps/worker/src/index.ts"]
    # Host network: the readiness gate and setup checks TCP-connect to each
    # box's public IPv6, and Docker's bridge network has no IPv6. Postgres is
    # reached on its loopback publish instead of the compose network.
    network_mode: host
    environment:
      DATABASE_URL: postgres://homehost:homehost@127.0.0.1:55433/homehost
      WORKER_POLL_MS: "2000"
      WORKER_ENV: dev
      WORKER_BASE_DOMAIN: dev.homehost.risktozero.sh
    env_file:
      - path: ../../.env.dev
        required: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  homehost-dev-postgres:
