name: homehost-dev

# Local dev loop: postgres + api (--watch) + web (vite) + worker (incus).
# One command: `bun run dev:up` (needs .env.dev; copy .env.dev.example).
# Open http://127.0.0.1:5174 — no dev domains needed. SHOWCASE_MODE in
# .env.dev picks the auth path: true = persona login (default, no OAuth),
# false = real GitHub OAuth (fill OAuth + OPERATOR_EMAILS first).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homehost
      POSTGRES_USER: homehost
      POSTGRES_PASSWORD: homehost
    ports:
      - "127.0.0.1:55433:5432"
    restart: unless-stopped
    volumes:
      - homehost-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehost -d homehost"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ../..:/app
    command: ["bash", "infra/dev/api-entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://homehost:homehost@postgres:5432/homehost
      HOST: "0.0.0.0"
      PORT: "3001"
    env_file:
      - path: ../../.env.dev
        required: true
    ports:
      - "3001:3001"
    networks:
      - default
      - edge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/apps/web
    volumes:
      - ../..:/app
    command: ["bun", "--bun", "vite", "--port", "5174", "--strictPort"]
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "5174:5174"
    networks:
      - default
      - edge
    restart: unless-stopped
    depends_on:
      - api

  worker:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    group_add:
      - "986"
    working_dir: /app
    volumes:
      - ../..:/app
      - /var/lib/incus/unix.socket:/var/lib/incus/unix.socket
      - /usr/bin/incus:/usr/bin/incus:ro
    command: ["bun", "apps/worker/src/index.ts"]
    environment:
      DATABASE_URL: postgres://homehost:homehost@postgres:5432/homehost
      WORKER_POLL_MS: "2000"
      WORKER_ENV: dev
      WORKER_BASE_DOMAIN: dev.homehost.risktozero.sh
    env_file:
      - path: ../../.env.dev
        required: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
networks:
  edge:
    name: homehost-edge_default
    external: true

volumes:
  homehost-dev-postgres:
