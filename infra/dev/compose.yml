name: homehost-dev

# Local dev loop: postgres + api (--watch) + web (vite). One command:
#   cp .env.dev.example .env.dev   # fill GitHub OAuth + operator email
#   bun run dev:up
# Ports 55433/3001/5174 stay clear of prod (55432/3000/5173).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homehost
      POSTGRES_USER: homehost
      POSTGRES_PASSWORD: homehost
    ports:
      - "127.0.0.1:55433:5432"
    restart: unless-stopped
    volumes:
      - homehost-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homehost -d homehost"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app
    volumes:
      - ../..:/app
    command: ["bash", "infra/dev/api-entrypoint.sh"]
    environment:
      DATABASE_URL: postgres://homehost:homehost@postgres:5432/homehost
      HOST: "0.0.0.0"
      PORT: "3001"
      SHOWCASE_MODE: "false"
    env_file:
      - path: ../../.env.dev
        required: false
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - default
      - edge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: oven/bun:1
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/apps/web
    volumes:
      - ../..:/app
    command: ["bun", "--bun", "vite", "--port", "5174", "--strictPort"]
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:5174:5174"
    networks:
      - default
      - edge
    restart: unless-stopped
    depends_on:
      - api

networks:
  edge:
    name: homehost-edge_default
    external: true

volumes:
  homehost-dev-postgres:
